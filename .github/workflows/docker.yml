name: Docker

# Two kinds of build. Every automatic build -- a push to main, a dependency
# update (dispatched by Rsem or nativesem), the weekly schedule -- is UNPINNED:
# every submodule is refreshed to the tip of its branch first, which is what
# the dashboard needs to track progress in typr, Rsem, NativeSem and rstt
# together. Only unpinned builds tag `latest` (what r-typing runs) and notify
# r-typing. A PINNED build, at the SHAs typr records, only happens on a manual
# run with `pinned`; it moves the `pinned` tag and leaves `latest` alone, so a
# reproducible image exists without the pins having to follow every upstream
# push. Either way the image records the four commits it was built from.
# A push to the `fuzz` branch builds the `fuzz` tag only, for r-typing's
# fuzzing runs: it neither moves `latest` nor notifies r-typing.
on:
  push:
    branches: [main, fuzz]
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:
    inputs:
      pinned:
        description: "Build the submodules at the SHAs typr pins (moves the `pinned` tag, not `latest`)"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

# A queued build refreshes the tips when it starts, so only the newest pending
# one needs to run; a running one is never cancelled, so `latest` is never
# left half-pushed.
concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      # .gitmodules declares a branch per submodule over public HTTPS: no token.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Refresh submodules to their branch tips (unpinned builds)
        id: pins
        run: |
          if [ "${{ github.event.inputs.pinned }}" = "true" ]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            git submodule update --remote --recursive
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the four commits
        id: shas
        run: |
          echo "typr=$(git rev-parse HEAD)"                >> "$GITHUB_OUTPUT"
          echo "rsem=$(git -C Rsem rev-parse HEAD)"        >> "$GITHUB_OUTPUT"
          echo "nativesem=$(git -C nativesem rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rstt=$(git -C rstt rev-parse HEAD)"        >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name, which ghcr.io requires.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/typr
          tags: |
            type=raw,value=latest,enable=${{ steps.pins.outputs.pinned == 'false' && github.ref == 'refs/heads/main' }}
            type=raw,value=pinned,enable=${{ steps.pins.outputs.pinned == 'true' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ steps.pins.outputs.pinned == 'false' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=pinned-sha-,enable=${{ steps.pins.outputs.pinned == 'true' && github.ref == 'refs/heads/main' }}
            type=raw,value=fuzz,enable=${{ github.ref == 'refs/heads/fuzz' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TYPR_SHA=${{ steps.shas.outputs.typr }}
            RSEM_SHA=${{ steps.shas.outputs.rsem }}
            NATIVESEM_SHA=${{ steps.shas.outputs.nativesem }}
            RSTT_SHA=${{ steps.shas.outputs.rstt }}
            PINNED=${{ steps.pins.outputs.pinned }}
            SUBJECT=${{ github.event_name }}

      # Notify r-typing so it reruns the pipeline on the new `latest`; a pinned
      # build leaves `latest` alone, so there is nothing new to run. Needs a PAT
      # with `workflow` scope on PRL-PRG/r-typing stored here as
      # PIPELINE_DISPATCH_TOKEN; until it exists this step fails without
      # failing the build.
      - name: Trigger r-typing pipeline
        if: steps.pins.outputs.pinned == 'false' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        continue-on-error: true
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: PRL-PRG/r-typing
          event-type: typr-updated
          client-payload: >-
            {"typr":"${{ steps.shas.outputs.typr }}",
             "rsem":"${{ steps.shas.outputs.rsem }}",
             "nativesem":"${{ steps.shas.outputs.nativesem }}",
             "rstt":"${{ steps.shas.outputs.rstt }}",
             "pinned":${{ steps.pins.outputs.pinned }}}
